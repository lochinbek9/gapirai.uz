# Hech bir server_name mos kelmagan so'rovlar (IP orqali kirish, noma'lum/begona host) uchun "tuzoq".
# Busiz nginx ularni birinchi blokka (admin.gapirai.uz) berib yuborardi.
# Bu server'da gapirai.uz, lodex-crm.uz va nodiygram.com bitta nginx'ni baham ko'radi -- ularning o'z server_name'lari
# oldin tekshiriladi, shuning uchun bu blok ularga ta'sir qilmaydi.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;                     # javobsiz ulanishni yopadi
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;   # ipv6only=on gapirai.uz blokida allaqachon bor, bu yerda takrorlanmaydi
    server_name _;
    ssl_reject_handshake on;        # sertifikat ko'rsatmaydi (nginx >= 1.19.4; bu serverda 1.24)
}
