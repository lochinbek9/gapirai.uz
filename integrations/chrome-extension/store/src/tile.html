<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { overflow: hidden; color: #fff; font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 140% at 0% 0%, #2f6bff 0%, #1a2a6c 45%, #0e0f12 100%); }
  .tile { width: var(--w); height: var(--h); display: flex; align-items: center; gap: var(--gap); padding: 0 var(--pad); }
  img { width: var(--icon); height: var(--icon); border-radius: calc(var(--icon) * 0.22); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-size: var(--t1); font-weight: 750; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin-top: calc(var(--t2) * 0.5); font-size: var(--t2); color: #d6dcff; line-height: 1.3; }
  .uz { display: inline-block; margin-top: calc(var(--t2) * 0.8); padding: 6px 14px; border-radius: 999px; background: #fff; color: #0e0f12;
    font-weight: 700; font-size: calc(var(--t2) * 0.85); }
</style></head>
<body><div class="tile" id="t">
  <img src="../../icons/icon128.png" alt="">
  <div><h1>GapirAI</h1><p id="p">YouTube videolarini oʻzbekcha ovoz va subtitr bilan tomosha qiling</p><span class="uz">UZ ovoz</span></div>
</div>
<script>
  const big = new URLSearchParams(location.search).get('size') === 'marquee'
  const v = big ? { w: '1400px', h: '560px', gap: '48px', pad: '110px', icon: '200px', t1: '84px', t2: '32px' }
                : { w: '440px', h: '280px', gap: '22px', pad: '30px', icon: '96px', t1: '40px', t2: '15px' }
  for (const [k, val] of Object.entries(v)) document.documentElement.style.setProperty('--' + k, val)
</script></body></html>
