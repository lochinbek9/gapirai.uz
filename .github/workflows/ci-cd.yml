name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Frontend & Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dubber_test
          POSTGRES_PASSWORD: dubber_test_pw
          POSTGRES_DB: dubber_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-subtests pytest-asyncio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run backend tests
        run: |
          mkdir -p outputs uploads
          PYTHONPATH=. python -c "from backend.models.database import create_tables; create_tables()"
          PYTHONPATH=. pytest backend/tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://dubber_test:dubber_test_pw@localhost:5432/dubber_test_db
          ASYNC_DATABASE_URL: postgresql+asyncpg://dubber_test:dubber_test_pw@localhost:5432/dubber_test_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-key
          AZURE_SPEECH_KEY: test-key
          AZURE_SPEECH_REGION: eastus
          DEBUG: "true"
        timeout-minutes: 15

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend
        timeout-minutes: 5

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://gapirai.uz/api
        timeout-minutes: 10

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.212.220.188
          username: gapirai
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "=== Finding project directory on production ==="
            TARGET_DIR=""
            for dir in "/home/gapirai/gapirai.uz" "$HOME/gapirai.uz" "/home/gapirai/ai-dubber" "$HOME/ai-dubber" "$HOME/projects/gapirai.uz" "/opt/xadichai"; do
              if [ -d "$dir/.git" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find "$HOME" -maxdepth 3 -name ".git" 2>/dev/null | head -n 1 | xargs -r dirname)
            fi

            if [ -z "$TARGET_DIR" ]; then
              echo "Error: Could not locate git repository under $HOME"
              exit 1
            fi

            echo "=== Found project repository at $TARGET_DIR ==="
            cd "$TARGET_DIR"
            git pull origin main
            echo "=== Restarting application services ==="
            docker restart dubber_backend dubber_worker 2>/dev/null || true
            echo "=== Successfully updated production repository ==="
