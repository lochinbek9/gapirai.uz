name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test Frontend & Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dubber_test
          POSTGRES_PASSWORD: dubber_test_pw
          POSTGRES_DB: dubber_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-subtests pytest-asyncio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run backend tests
        run: |
          mkdir -p outputs uploads
          PYTHONPATH=. python -c "from backend.models.database import create_tables; create_tables()"
          PYTHONPATH=. pytest backend/tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://dubber_test:dubber_test_pw@localhost:5432/dubber_test_db
          ASYNC_DATABASE_URL: postgresql+asyncpg://dubber_test:dubber_test_pw@localhost:5432/dubber_test_db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          OPENAI_API_KEY: sk-test-key
          AZURE_SPEECH_KEY: test-key
          AZURE_SPEECH_REGION: eastus
          DEBUG: "true"
        timeout-minutes: 15

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend
        timeout-minutes: 5

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.gapirai.uz
        timeout-minutes: 10

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 173.212.220.188
          username: gapirai
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            # Helper for running sudo with password from SSH_PASSWORD
            run_sudo() {
              if command -v sudo >/dev/null 2>&1; then
                if [ -n "${{ secrets.SSH_PASSWORD }}" ]; then
                  echo "${{ secrets.SSH_PASSWORD }}" | sudo -S "$@" 2>/dev/null || sudo -n "$@" 2>/dev/null || "$@" 2>/dev/null || true
                else
                  sudo -n "$@" 2>/dev/null || "$@" 2>/dev/null || true
                fi
              else
                "$@" 2>/dev/null || true
              fi
            }

            echo "=== Environment and Node Discovery ==="
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true

            # Find Node anywhere on the system and put it in PATH
            for candidate in \
              $(which node 2>/dev/null) \
              $HOME/.nvm/versions/node/*/bin/node \
              /home/*/.nvm/versions/node/*/bin/node \
              /root/.nvm/versions/node/*/bin/node \
              /usr/local/bin/node \
              /usr/bin/node \
              /snap/bin/node \
              /opt/node*/bin/node; do
              if [ -x "$candidate" ]; then
                export PATH="$(dirname "$candidate"):$PATH"
                break
              fi
            done

            export PATH="/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:$HOME/.local/bin:$HOME/bin:$PATH"

            echo "Current user: $(whoami)"
            echo "Node path:    $(which node 2>/dev/null || echo 'not found') ($(node -v 2>/dev/null || echo 'N/A'))"
            echo "NPM path:     $(which npm 2>/dev/null || echo 'not found') ($(npm -v 2>/dev/null || echo 'N/A'))"
            echo "PM2 path:     $(which pm2 2>/dev/null || echo 'not found')"

            echo "=== Checking port 3000 process ==="
            P3000_PID=$(ss -tulpn 'sport = :3000' 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | head -n 1 || true)
            if [ -z "$P3000_PID" ]; then
              P3000_PID=$(lsof -ti :3000 2>/dev/null || true)
            fi
            echo "Port 3000 initial PID: $P3000_PID"
            if [ -n "$P3000_PID" ]; then
              ps -fp "$P3000_PID" || true
              ls -l "/proc/$P3000_PID/cwd" 2>/dev/null || true
              cat "/proc/$P3000_PID/cmdline" 2>/dev/null | tr '\0' ' ' || true
              echo ""
            fi

            echo "=== Finding project repository ==="
            TARGET_DIR=""
            for dir in "/home/gapirai/gapirai.uz" "$HOME/gapirai.uz" "/home/gapirai/ai-dubber" "$HOME/ai-dubber" "$HOME/projects/gapirai.uz" "/opt/xadichai"; do
              if [ -d "$dir/.git" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR=$(find "$HOME" -maxdepth 3 -name ".git" 2>/dev/null | head -n 1 | xargs -r dirname)
            fi

            if [ -z "$TARGET_DIR" ]; then
              echo "Error: Could not locate git repository"
              exit 1
            fi

            echo "Found project repository at: $TARGET_DIR"
            cd "$TARGET_DIR"

            echo "=== Pulling latest changes from ${{ github.repository }} ==="
            export GIT_TERMINAL_PROMPT=0
            git reset --hard HEAD || true
            git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
            git checkout -B main FETCH_HEAD -f
            git reset --hard FETCH_HEAD
            git remote set-url origin "git@github.com:${{ github.repository }}.git" 2>/dev/null || true
            echo "Git sync complete: $(git log -1 --oneline)"

            echo "=== Ensuring workspace ownership and building Frontend ==="
            run_sudo chown -R gapirai:gapirai "$TARGET_DIR"
            if [ -d "frontend" ]; then
              cd frontend
              export NEXT_PUBLIC_API_URL="https://api.gapirai.uz"
              export BROWSERSLIST_IGNORE_OLD_DATA=true
              export NEXT_TELEMETRY_DISABLED=1
              export NODE_OPTIONS="--max-old-space-size=4096"
              npm ci --prefer-offline 2>/dev/null || npm install
              npm run build
              echo "Frontend build completed successfully!"

              # Check for destination directories
              for dest in "/var/www/xadichai.uz/app" "/var/www/gapirai.uz/app" "/var/www/xadichai.uz/public" "/var/www/gapirai.uz/public"; do
                if [ -d "$dest" ]; then
                  echo "Syncing build to destination: $dest"
                  run_sudo rsync -a --delete .next/ "$dest/.next/" || true
                  if [ -d "public" ]; then
                    run_sudo rsync -a --delete public/ "$dest/public/" || true
                  fi
                  if [ -d ".next/standalone" ]; then
                    run_sudo rsync -a --delete .next/standalone/ "$dest/" || true
                  fi
                fi
              done
              cd "$TARGET_DIR"
            fi

            echo "=== Restarting Services ==="
            # Docker backend & worker
            echo "Restarting backend containers..."
            docker restart dubber_backend dubber_worker 2>/dev/null || true
            CONTAINERS_3000=$(docker ps -q --filter "publish=3000" 2>/dev/null || true)
            if [ -n "$CONTAINERS_3000" ]; then
              docker restart $CONTAINERS_3000 2>/dev/null || true
            fi

            # PM2 (gapirai user) with strict timeout
            echo "Checking PM2..."
            if command -v pm2 >/dev/null 2>&1; then
              timeout 10s pm2 restart all --update-env 2>/dev/null || timeout 5s pm2 reload all 2>/dev/null || true
            fi

            # Systemd services
            echo "Checking systemd services..."
            for svc in gapirai-frontend xadichai-frontend frontend gapirai; do
              if systemctl is-enabled --quiet "$svc" 2>/dev/null || systemctl is-active --quiet "$svc" 2>/dev/null; then
                echo "Restarting/starting systemd service: $svc"
                timeout 25s run_sudo systemctl restart "$svc" 2>/dev/null || true
              fi
            done

            # Supervisor
            timeout 10s run_sudo supervisorctl restart all 2>/dev/null || true

            # Check if port 3000 process was restarted
            sleep 3
            NEW_P3000_PID=$(ss -tulpn 'sport = :3000' 2>/dev/null | grep -o 'pid=[0-9]*' | cut -d= -f2 | head -n 1 || true)
            if [ -z "$NEW_P3000_PID" ]; then
              NEW_P3000_PID=$(lsof -ti :3000 2>/dev/null || true)
            fi
            echo "Port 3000 new PID: $NEW_P3000_PID (previous was: $P3000_PID)"

            # If port 3000 process didn't restart and is still the exact old PID, kill it to force restart
            if [ -n "$P3000_PID" ] && [ "$NEW_P3000_PID" = "$P3000_PID" ]; then
              echo "Process on port 3000 was not restarted by managers. Restarting it..."
              kill -15 "$P3000_PID" 2>/dev/null || run_sudo kill -15 "$P3000_PID" 2>/dev/null || true
              sleep 2
              if ss -tulpn 'sport = :3000' 2>/dev/null | grep -q '3000'; then
                kill -9 "$P3000_PID" 2>/dev/null || run_sudo kill -9 "$P3000_PID" 2>/dev/null || true
                sleep 2
              fi
              # If port 3000 is now dead, restart Next.js in background
              if ! ss -tulpn 'sport = :3000' 2>/dev/null | grep -q '3000'; then
                echo "Starting frontend fresh via PM2 or npm start..."
                cd "$TARGET_DIR/frontend"
                if command -v pm2 >/dev/null 2>&1; then
                  pm2 start npm --name "gapirai-frontend" -- start || true
                else
                  nohup npm start > "$TARGET_DIR/frontend.log" 2>&1 &
                fi
                sleep 4
              fi
            fi

            # Nginx reload
            run_sudo nginx -t 2>/dev/null && run_sudo systemctl reload nginx 2>/dev/null || true

            echo "=== Verification ==="
            curl -sI http://127.0.0.1:3000 | head -n 5 || echo "Could not reach :3000"
            echo "=== Deployment finished successfully ==="
