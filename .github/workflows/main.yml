name: Node.js CI/CD

# Controls when the workflow will run
on:
  push:
    branches:
      - main # Trigger CI for changes to the "main" branch
  pull_request:
    branches:
      - main # Trigger CI for pull requests targeting "main"

# Define jobs for the workflow
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e  # Stop execution if any command fails

            # Source the NVM to ensure using the right Node.js version
            [ -s "$HOME/.nvm/nvm.sh" ] && \. "$HOME/.nvm/nvm.sh"
            echo "Node.js version: $(node -v)"

            # Change to the project directory
            cd ~/ai-dubber
            echo "Changed directory to ~/ai-dubber"

            # Pull the latest code from the current branch instead of hardcoding main
            # (or stay on main but ensure we have the latest)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            echo "Git pull completed successfully."

            docker compose up -d --build
