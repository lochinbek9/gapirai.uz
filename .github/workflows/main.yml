name: Node.js CI/CD

# Controls when the workflow will run
on:
  push:
    branches:
      - main # Trigger CI for changes to the "main" branch
  pull_request:
    branches:
      - main # Trigger CI for pull requests targeting "main"

# Define jobs for the workflow
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
