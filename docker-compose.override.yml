services:
  download_service:
    image: ai-dubber-backend
    container_name: dubber_downloader
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./:/app
    command: python /app/download_service.py

  backend:
    environment:
      - DOWNLOAD_SERVICE_URL=http://download_service:8001

  worker:
    environment:
      - DOWNLOAD_SERVICE_URL=http://download_service:8001

  cookie_refresher:
    image: ai-dubber-backend
    container_name: dubber_cookie_refresher
    env_file:
      - .env
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - ./:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    command: xvfb-run -a -s "-screen 0 1024x768x24" python /app/backend/services/cookie_refresher.py
    restart: unless-stopped
